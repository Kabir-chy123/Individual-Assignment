<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Student Restaurants</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="index.html" class="logo">StudentEats</a>

      <nav>
        <a href="index.html#restaurants">Restaurants</a>
        <a href="index.html#map-section">Map</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main>
      <section class="account-section">
        <h1>Login</h1>

        <form id="login-form">
          <label for="username">Username</label>
          <input type="text" id="username" required />

          <label for="password">Password</label>
          <input type="password" id="password" required />

          <button type="submit">Login</button>
        </form>

        <p id="login-message"></p>

        <p>
          Don't have an account?
          <a href="register.html">Register</a>
        </p>

        <a href="index.html" class="back-link">← Back to restaurants</a>
      </section>
    </main>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
