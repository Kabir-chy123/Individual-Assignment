<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile | StudentEats</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="index.html" class="logo">StudentEats</a>

      <nav>
        <a href="index.html#restaurants">Restaurants</a>
        <a href="index.html#map-section">Map</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main>
      <section class="account-section">
        <h2>My Profile</h2>

        <div id="profile-info">
          <p>Loading profile...</p>
        </div>

        <h3>Update Profile</h3>

        <form id="update-form">
          <label for="update-username"> Username </label>

          <input type="text" id="update-username" required />

          <label for="update-email"> Email </label>

          <input type="email" id="update-email" required />

          <button type="submit">Update Profile</button>
        </form>

        <p id="update-message"></p>

        <h3>Profile Picture</h3>

        <form id="avatar-form">
          <label for="avatar"> Choose profile picture </label>

          <input type="file" id="avatar" accept="image/*" required />

          <button type="submit">Upload Picture</button>
        </form>

        <p id="avatar-message"></p>

        <button type="button" id="logout-button">Logout</button>

        <a href="index.html" class="back-link"> ← Back to restaurants </a>
      </section>
    </main>

    <script type="module" src="js/profile.js"></script>
  </body>
</html>
